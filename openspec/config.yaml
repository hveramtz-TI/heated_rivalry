schema: spec-driven

context: |
  Workspace: heated_rivalry; authoritative root is this repository.
  Project: frontend/ — Next.js 16.3.6 App Router, React 19.3.0, TypeScript 5.
  Styling and motion: Tailwind CSS 4, GSAP 3.14.2, Lenis 1.3.17, Motion 12.26.2.
  Architecture: single-page React composition with app/, components/, and static public assets.
  Conventions: strict TypeScript, ESLint Next.js Core Web Vitals, npm in frontend/.
  Testing: no configured test runner or workspace-wide test command; lint and build scripts exist.
  Review: fixed 400 changed-line budget; delivery is stacked-to-main and risk-gated.

persistence:
  mode: openspec
  artifact: sdd-init/heated_rivalry

strict_tdd: false

projects:
  - path: frontend/
    stack: Next.js 16.3.6 App Router, React 19.3.0, TypeScript 5, Tailwind CSS 4, GSAP, Lenis, Motion
    package_manager: npm
    test_command: null
    test_framework: null
    coverage_command: null
    lint_command: npm run lint
    typecheck_command: null
    format_command: null
    build_command: npm run build

testing:
  strict_tdd: false
  workspace_test_command: null
  reason: No explicit workspace-wide test command covers the discovered project; frontend/package.json has no test script.
  capabilities_file: openspec/testing-capabilities.md

rules:
  proposal:
    - Include rollback plans for risky changes.
    - Preserve unresolved product decisions instead of inventing requirements.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords where normative behavior is required.
  design:
    - Document architecture decisions with rationale.
    - Keep protected hero/header animation boundaries explicit.
  tasks:
    - Group tasks by phase and keep each task completable in one session.
    - Forecast the 400-line review budget and split oversized work.
  apply:
    guidelines:
      - Follow existing frontend patterns and preserve the current audio-player contract.
    tdd: false
    test_command: null
  verify:
    test_command: null
    build_command: npm run build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
